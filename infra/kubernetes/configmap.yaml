apiVersion: v1
kind: ConfigMap
metadata:
  name: logoca-config
  namespace: logoca
data:
  NODE_ENV: "production"
  ENV: "production"
  POSTGRES_DB: "logoca_db"
  POSTGRES_PORT: "5432"
  POSTGRES_HOST: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
  IGNITE_HOST: "ignite"
  IGNITE_PORT: "10800"
  IGNITE_URL: "ignite:10800"
  IGNITE_CACHE_USER: "user-cache"
  IGNITE_CACHE_ADMIN: "admin-cache"
  NEST_PORT: "3000"
  FASTAPI_PORT: "8000"
  CORS_ORIGIN: "https://logoca.com.br,https://admin.logoca.com.br"
  LOG_LEVEL: "info"
  CONTACT_EMAIL: "logocalogisticas@contato.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: logoca
data:
  init.sql: |
    -- será montado via volume; este ConfigMap é placeholder para kubectl create configmap
    -- Use: kubectl create configmap postgres-init --from-file=../postgres/init.sql -n logoca
