apiVersion: v1
kind: Service
metadata:
  name: backend-nest
  namespace: logoca
  labels:
    app: backend-nest
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: backend-nest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-nest
  namespace: logoca
  labels:
    app: backend-nest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-nest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend-nest
    spec:
      containers:
        - name: backend-nest
          image: logoca/backend-nest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: DATABASE_URL_NEST
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: RABBITMQ_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: KAFKA_BROKERS
            - name: IGNITE_URL
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: IGNITE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
---
# HPA opcional
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-nest-hpa
  namespace: logoca
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-nest
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
