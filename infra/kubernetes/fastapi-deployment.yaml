apiVersion: v1
kind: Service
metadata:
  name: backend-fastapi
  namespace: logoca
  labels:
    app: backend-fastapi
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend-fastapi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-fastapi
  namespace: logoca
  labels:
    app: backend-fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-fastapi
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend-fastapi
    spec:
      containers:
        - name: backend-fastapi
          image: logoca/backend-fastapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: ENV
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: REDIS_URL
            - name: IGNITE_URL
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: IGNITE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: logoca-secrets
                  key: JWT_SECRET
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: logoca-config
                  key: KAFKA_BROKERS
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-fastapi-hpa
  namespace: logoca
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-fastapi
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
